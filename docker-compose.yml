name: nightjar

services:
  mongo:
    image: mongo:7
    command: ["--quiet", "--logpath", "/dev/null"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/temporal:latest
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --namespace
      - nightjar
      - --log-level
      - warn
    ports:
      - "7233:7233"
      - "8233:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "namespace", "list", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: nightjar
      MINIO_ROOT_PASSWORD: nightjar-dev-secret
      # so `docker compose exec minio mc ...` is authenticated, not just `mc ready`
      MC_HOST_local: http://nightjar:nightjar-dev-secret@localhost:9000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://nightjar:nightjar-dev-secret@minio:9000
    entrypoint:
      - sh
      - -c
      - |
        mc mb --ignore-existing local/nightjar-exports-dev
        mc anonymous set none local/nightjar-exports-dev

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel/config.yaml"]
    extra_hosts:
      - "tempo.observability.nightjar-platform.internal:2001:db8::1"
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel/config.yaml:ro

volumes:
  mongo-data:
  minio-data:
