apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nightjar-ingest-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nightjar-labs/nightjar.git
    targetRevision: HEAD
    path: deploy/helm/nightjar-ingest
    helm:
      valueFiles:
        - values.yaml
        - ../app-values/prod/defaults/values.yaml
  destination:
    server: https://prod.eks.internal
    namespace: nightjar
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
