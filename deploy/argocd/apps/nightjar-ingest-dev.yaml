apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nightjar-ingest-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nightjar-labs/nightjar.git
    targetRevision: HEAD
    path: deploy/helm/nightjar-ingest
    helm:
      valueFiles:
        - values.yaml
        - ../app-values/dev/defaults/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: nightjar
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
