apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nightjar-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nightjar-labs/nightjar.git
    targetRevision: HEAD
    path: deploy/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
