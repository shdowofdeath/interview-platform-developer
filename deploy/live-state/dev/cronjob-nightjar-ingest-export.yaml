apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightjar-ingest-export
  namespace: nightjar
  uid: 5f2c1d84-7a19-4b63-9e05-c8d1a2f47b30
  resourceVersion: "184920371"
  creationTimestamp: "2026-09-07T16:41:02Z"
  labels:
    app.kubernetes.io/name: nightjar-ingest
    app.kubernetes.io/version: "0.4.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: export
spec:
  schedule: "0 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nightjar-ingest
            app.kubernetes.io/component: export
        spec:
          restartPolicy: Never
          serviceAccountName: nightjar-ingest
          containers:
            - name: export
              image: ghcr.io/nightjar-labs/nightjar-ingest:latest
              imagePullPolicy: Always
              command: ["uv", "run", "python", "scripts/run_export.py"]
              envFrom:
                - configMapRef:
                    name: nightjar-ingest
                - secretRef:
                    name: nightjar-ingest
              env:
                - name: ENVIRONMENT
                  value: "dev"
              resources:
                limits:
                  cpu: 500m
                  memory: 512Mi
                requests:
                  cpu: 200m
                  memory: 256Mi
status:
  lastScheduleTime: "2026-09-08T02:00:00Z"
  lastSuccessfulTime: "2026-09-08T02:00:09Z"
