apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nightjar-ingest.name" . }}
  labels:
    {{- include "nightjar-ingest.labels" . | nindent 4 }}
data:
  MONGO_DATABASE: {{ .Values.config.mongoDatabase | quote }}
  TEMPORAL_ADDRESS: {{ .Values.config.temporalAddress | quote }}
  TEMPORAL_NAMESPACE: {{ .Values.config.temporalNamespace | quote }}
  OTEL_ENDPOINT: {{ .Values.config.otelEndpoint | quote }}
  OTEL_ENABLED: {{ .Values.config.otelEnabled | quote }}
  REPUTATION_BASE_URL: {{ .Values.config.reputationBaseUrl | quote }}
  STALE_AFTER_HOURS: {{ .Values.config.staleAfterHours | quote }}
  MAX_PAGE_LIMIT: {{ .Values.config.maxPageLimit | quote }}
  CPE_DICTIONARY_PATH: "data/seed/cpe_dictionary.json"
