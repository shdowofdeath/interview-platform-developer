apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nightjar-ingest.name" . }}
  labels:
    {{- include "nightjar-ingest.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nightjar-ingest.name" . }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "nightjar-ingest.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: api
          image: {{ include "nightjar-ingest.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uv", "run", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "9400"]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: {{ include "nightjar-ingest.name" . }}
            - secretRef:
                name: {{ include "nightjar-ingest.name" . }}
          env:
            - name: ENVIRONMENT
              value: {{ .Values.config.environment | default "dev" | quote }}
          livenessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
