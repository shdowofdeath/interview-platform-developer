apiVersion: v1
kind: Service
metadata:
  name: {{ include "nightjar-ingest.name" . }}
  labels:
    {{- include "nightjar-ingest.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "nightjar-ingest.name" . }}
  ports:
    - name: http
      port: 80
      targetPort: http
