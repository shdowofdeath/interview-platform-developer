image:
  tag: "0.4.2"
  pullPolicy: IfNotPresent

api:
  replicas: 3
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

worker:
  replicas: 2
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 4Gi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

config:
  environment: prod
  maxPageLimit: 1000
